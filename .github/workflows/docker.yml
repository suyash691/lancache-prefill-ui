name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    # Only build-validate PRs that can affect the image.
    paths:
      - Dockerfile
      - .dockerignore
      - src/**
      - frontend/**
      - .github/workflows/docker.yml
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: reading the repo is all the default
# needs. The publish job elevates itself to packages: write — the only write
# permission this workflow ever uses (CodeQL: missing-workflow-permissions).
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs: prove the production image still builds. Never pushes, never logs in,
  # and runs with the read-only workflow-level token.
  build:
    name: Build (validate only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pushes to main publish :latest + :sha-<short>; version tags (v1.2.3)
  # additionally publish :1.2.3 and :1.2.
  publish:
    name: Publish to GHCR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/<repo> — scoped to this job only
    steps:
      - uses: actions/checkout@v4

      # arm64 layers build under QEMU emulation (slow for the dotnet compile,
      # but common lancache hosts include ARM NAS boxes). Drop the platform
      # below if publish times become a problem.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance manifests render as confusing "unknown/unknown" entries
          # next to multi-arch images in the GHCR UI; enable when SLSA
          # attestation is actually wanted.
          provenance: false
