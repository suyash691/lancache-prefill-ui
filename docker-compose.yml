services:
  lancache-prefill:
    build: .
    container_name: lancache-prefill
    restart: unless-stopped
    network_mode: host
    # The container now runs as non-root (UID 1654, the .NET base image's 'app'
    # user). The config volume must be writable by it — for existing installs run:
    #   sudo chown -R 1654:1654 ./config
    # To temporarily restore the old root behavior instead, uncomment:
    # user: "0:0"
    volumes:
      - ${CONFIG_DIR:-./config}:/Config
      - ${LANCACHE_CACHE_DIR:-./cache}:/LancacheCache:ro
    environment:
      - CONFIG_DIR=/Config
      - LANCACHE_CACHE_DIR=/LancacheCache
      - PREFILL_SCHEDULE=${PREFILL_SCHEDULE:-0 4 * * *}
      - SCAN_SCHEDULE=${SCAN_SCHEDULE:-0 3 */3 * *}
      - PORT=${PORT:-28542}
      - TZ=${TZ:-Europe/London}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
